<div class="min-h-screen bg-white text-slate-900 flex flex-col font-sans selection:bg-teal-100 selection:text-teal-900">
  
  <!-- Accessibility Skip Link -->
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:bg-teal-700 focus:text-white focus:px-4 focus:py-2.5 focus:rounded-md focus:shadow-xl focus:outline-none focus:ring-4 focus:ring-teal-400 font-bold"
  >
    Skip to main content
  </a>

  <!-- Real-time Network Status & Offline Stale Data Banner -->
  <app-network-banner></app-network-banner>

  <!-- Top Demo / Realistic Data Notice Banner -->
  <app-demo-banner></app-demo-banner>

  <!-- Sticky Top Navigation Bar (Desktop & Tablet) -->
  <app-navbar></app-navbar>

  <!-- Main Application Router Viewport (with bottom padding for mobile tab bar) -->
  <main id="main-content" class="flex-1 w-full pb-20 md:pb-0" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Accessibility-First Footer (Desktop/Tablet) -->
  <div class="hidden md:block">
    <app-footer></app-footer>
  </div>

  <!-- Mobile Bottom Tab Bar (Visible on mobile viewports & Capacitor Android) -->
  <app-mobile-tab-nav></app-mobile-tab-nav>

</div>
